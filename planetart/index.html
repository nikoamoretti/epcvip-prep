<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#071018"><title>PlanetArt Drive Brief</title></head><body style="margin:0;background:#071018;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh"><div>Loading interview brief…</div><script>(async()=>{try{const n=6;const p=await Promise.all(Array.from({length:n},(_,i)=>fetch(`./c${i+1}.txt`).then(r=>{if(!r.ok)throw Error(`chunk ${i+1}`);return r.text()})));const b=Uint8Array.from(atob(p.join('')),c=>c.charCodeAt(0));const h=new TextDecoder().decode(b);document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<div style="padding:24px">Could not load the brief. Refresh this page.</div>'}})();</script></body></html>
